<!DOCTYPE html>
<html>
<head>
  <title>Transit Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { height: 100vh; }
    #panel {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      background: white; padding: 10px 14px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); font-size: 14px; min-width: 270px;
    }
    #panel h3 { margin: 0 0 8px 0; }
    .row { padding: 6px 0; border-top: 1px solid #eee; }
    .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 4px; }
    .badge { color: white; padding: 1px 6px; border-radius: 4px; font-size: 12px; margin-left: 4px; }
    .stale { color: #b00; font-size: 12px; }
  </style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h3>Current Schedule</h3>
  <div id="schedule">Waiting for schedule...</div>
</div>

<script>
  // Create the map, centred on Oshawa
  const map = L.map("map").setView([43.91, -78.88], 12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  const colors = { R1: "#e6194b", R2: "#3cb44b", R3: "#4363d8" };
  const levelColors = { PEAK: "#d32f2f", NORMAL: "#f9a825", OFF_PEAK: "#388e3c" };
  const stopMarkers = {};   // stopId -> list of dots (a stop on 2 routes has 2 dots)
  const stopNames = {};     // stopId -> name
  const routeNames = {};    // routeId -> name

  // ---- Routes and stops ----
  fetch("/api/routes")
    .then(response => response.json())
    .then(routes => {
      for (const [routeId, route] of Object.entries(routes)) {
        routeNames[routeId] = route.name;
        const points = route.stops.map(stop => [stop[2], stop[3]]);
        L.polyline(points, { color: colors[routeId], weight: 5 })
          .addTo(map)
          .bindPopup(`${routeId}: ${route.name}`);

        for (const [stopId, name, lat, lon] of route.stops) {
          const marker = L.circleMarker([lat, lon], { radius: 6, color: "#333", fillColor: "#fff", fillOpacity: 1 })
            .addTo(map)
            .bindPopup(`<b>${name}</b> (${stopId})`);
          if (!stopMarkers[stopId]) stopMarkers[stopId] = [];
          stopMarkers[stopId].push(marker);
          stopNames[stopId] = name;
        }
      }
    });

  // ---- Live buses ----
  const busMarkers = {};

  function updateBuses() {
    fetch("/api/vehicles")
      .then(response => response.json())
      .then(buses => {
        for (const bus of buses) {
          const info = `<b>${bus.vehicleId}</b> (${bus.routeId})<br>
                        Next stop: ${stopNames[bus.nextStopId] || bus.nextStopId}<br>
                        Speed: ${bus.speedKmh} km/h<br>
                        Passengers: ${bus.occupancy}/${bus.capacity}`;

          if (busMarkers[bus.vehicleId]) {
            busMarkers[bus.vehicleId].setLatLng([bus.lat, bus.lon]).setPopupContent(info);
          } else {
            busMarkers[bus.vehicleId] = L.circleMarker([bus.lat, bus.lon], {
              radius: 10, color: "#000", weight: 2,
              fillColor: colors[bus.routeId], fillOpacity: 1
            }).addTo(map).bindPopup(info);
          }
        }
      });
  }

  // ---- ETAs: shown when you click a stop ----
  function updateEtas() {
    fetch("/api/etas")
      .then(response => response.json())
      .then(etas => {
        for (const [stopId, markers] of Object.entries(stopMarkers)) {
          const arrivals = etas[stopId] || [];
          let html = `<b>${stopNames[stopId]}</b> (${stopId})<br>`;
          if (arrivals.length === 0) html += "No buses approaching";
          for (const a of arrivals) {
            const time = a.minutes < 1 ? "Arriving now" : `${Math.round(a.minutes)} min`;
            html += `${a.vehicleId} (${a.routeId}): ${time}<br>`;
          }
          for (const marker of markers) marker.setPopupContent(html);
        }
      });
  }

  // ---- Schedule panel (top right) ----
  function updateSchedules() {
    fetch("/api/schedules")
      .then(response => response.json())
      .then(schedules => {
        const routeIds = Object.keys(schedules).sort();
        if (routeIds.length === 0) return;   // keep "Waiting for schedule..."

        let html = "";
        for (const routeId of routeIds) {
          const s = schedules[routeId];
          const level = s.reason.split(" ")[0];               // reason starts with PEAK / NORMAL / OFF_PEAK
          const stale = Date.now() - s.timestamp > 30000;    // no update for 30 seconds
          html += `<div class="row">
            <span class="dot" style="background:${colors[routeId]}"></span>
            <b>${routeId}</b> ${routeNames[routeId] || ""}
            <span class="badge" style="background:${levelColors[level] || "#777"}">${level.replace("_", " ")}</span><br>
            Bus every <b>${s.headwayMinutes} min</b> &middot; ${s.vehiclesAssigned} buses
            ${stale ? '<br><span class="stale">Last known schedule (no recent updates)</span>' : ""}
          </div>`;
        }
        document.getElementById("schedule").innerHTML = html;
      });
  }

  setInterval(updateBuses, 2000);
  setInterval(updateEtas, 2000);
  setInterval(updateSchedules, 2000);
</script>
</body>
</html>
